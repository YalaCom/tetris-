<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>FIT</title>

<style>
:root{
  --bg:#05070d;
  --panel:rgba(15,20,32,.82);
  --line:rgba(255,255,255,.1);
  --text:#f5f7ff;
  --muted:#9aa5bd;
  --cyan:#36e6ff;
  --blue:#377dff;
  --green:#4cff9a;
  --yellow:#ffd84c;
  --red:#ff4f6d;
  --purple:#b968ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%, #101b38 0%, #070a13 40%, #03050a 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:fixed;
  inset:0;
  touch-action:none;
}

button{
  font:inherit;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

#game{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.vignette{
  pointer-events:none;
  position:absolute;
  inset:0;
  z-index:4;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.4),transparent 18%,transparent 76%,rgba(0,0,0,.65)),
    radial-gradient(circle at center,transparent 38%,rgba(0,0,0,.48) 100%);
}

.scanlines{
  pointer-events:none;
  position:absolute;
  inset:0;
  z-index:5;
  opacity:.12;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(255,255,255,.05) 4px
  );
}

#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:
    calc(env(safe-area-inset-top) + 10px)
    12px
    0;
  pointer-events:none;
}

.topRow{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}

.logoBox{
  min-width:86px;
  padding:9px 12px 8px;
  border:1px solid rgba(54,230,255,.32);
  border-radius:14px;
  background:linear-gradient(145deg,rgba(8,18,34,.92),rgba(10,14,24,.72));
  box-shadow:
    inset 0 0 24px rgba(54,230,255,.05),
    0 8px 28px rgba(0,0,0,.25);
  backdrop-filter:blur(10px);
}

.logo{
  font-weight:1000;
  font-style:italic;
  letter-spacing:4px;
  font-size:22px;
  line-height:1;
  color:white;
  text-shadow:
    0 0 8px var(--cyan),
    0 0 18px rgba(54,230,255,.8);
}

.logoSub{
  margin-top:5px;
  font-size:7px;
  letter-spacing:2px;
  color:var(--cyan);
  opacity:.8;
}

.stats{
  flex:1;
  max-width:370px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.stat{
  min-width:0;
  padding:8px 7px;
  border-radius:13px;
  background:linear-gradient(150deg,rgba(18,24,40,.9),rgba(9,13,23,.75));
  border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.2);
  text-align:center;
}

.statLabel{
  display:block;
  margin-bottom:3px;
  color:var(--muted);
  font-size:8px;
  font-weight:800;
  letter-spacing:1.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.statValue{
  display:block;
  font-size:17px;
  font-weight:1000;
  line-height:1;
  text-shadow:0 0 12px rgba(255,255,255,.2);
}

#scoreValue{
  color:var(--cyan);
}

#levelValue{
  color:var(--yellow);
}

#comboValue{
  color:var(--green);
}

#missionPanel{
  margin-top:8px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:13px;
  background:linear-gradient(90deg,rgba(10,14,25,.82),rgba(18,25,40,.72));
  backdrop-filter:blur(10px);
  box-shadow:0 8px 22px rgba(0,0,0,.2);
}

.missionTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:6px;
}

#missionText{
  min-width:0;
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
  color:#d9e6ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#missionCount{
  flex:none;
  font-size:10px;
  font-weight:1000;
  color:var(--cyan);
}

.progressTrack{
  position:relative;
  height:5px;
  overflow:hidden;
  border-radius:10px;
  background:rgba(255,255,255,.08);
}

#missionBar{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--blue),var(--cyan),var(--green));
  box-shadow:0 0 12px var(--cyan);
  transition:width .25s ease;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:12;
  padding:
    0
    14px
    calc(env(safe-area-inset-bottom) + 14px);
  pointer-events:none;
}

.controlRow{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:14px;
}

.moveControls{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.actionControls{
  display:flex;
  align-items:flex-end;
  gap:10px;
  pointer-events:auto;
}

.ctrl{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:62px;
  height:62px;
  border:none;
  border-radius:20px;
  color:white;
  background:
    linear-gradient(145deg,rgba(37,46,69,.95),rgba(12,17,30,.95));
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.2),
    inset 0 -8px 20px rgba(0,0,0,.28),
    0 8px 24px rgba(0,0,0,.36),
    0 0 0 1px rgba(255,255,255,.12);
  overflow:hidden;
  transform:translateZ(0);
}

.ctrl::before{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.09),transparent 48%);
  pointer-events:none;
}

.ctrl:active,
.ctrl.pressed{
  transform:scale(.91);
  filter:brightness(1.3);
}

.ctrlSymbol{
  position:relative;
  z-index:2;
  font-size:26px;
  font-weight:1000;
  text-shadow:0 0 12px currentColor;
}

#leftBtn,
#rightBtn{
  color:var(--cyan);
}

#rotateBtn{
  width:70px;
  height:70px;
  border-radius:23px;
  color:var(--yellow);
  background:
    radial-gradient(circle at 50% 28%,rgba(255,216,76,.2),transparent 55%),
    linear-gradient(145deg,rgba(44,44,57,.97),rgba(15,16,25,.97));
}

#dropBtn{
  width:77px;
  height:77px;
  border-radius:25px;
  color:white;
  background:
    radial-gradient(circle at 50% 30%,rgba(55,125,255,.46),transparent 56%),
    linear-gradient(145deg,#2359bc,#132857 70%);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.35),
    inset 0 -12px 24px rgba(0,0,0,.3),
    0 8px 28px rgba(0,0,0,.45),
    0 0 0 1px rgba(80,160,255,.5),
    0 0 24px rgba(55,125,255,.28);
}

#dropBtn .ctrlSymbol{
  font-size:30px;
}

#powerBtn{
  width:51px;
  height:51px;
  border-radius:17px;
  color:var(--purple);
  opacity:.45;
}

#powerBtn.ready{
  opacity:1;
  animation:powerPulse 1.1s ease-in-out infinite;
}

@keyframes powerPulse{
  0%,100%{
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.25),
      0 8px 24px rgba(0,0,0,.4),
      0 0 0 1px rgba(185,104,255,.25),
      0 0 10px rgba(185,104,255,.25);
  }
  50%{
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.35),
      0 8px 24px rgba(0,0,0,.4),
      0 0 0 2px rgba(185,104,255,.55),
      0 0 28px rgba(185,104,255,.65);
  }
}

#startScreen,
#gameOverScreen,
#pauseScreen{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at 50% 35%,rgba(35,81,160,.22),transparent 38%),
    rgba(2,4,9,.78);
  backdrop-filter:blur(8px);
}

.hidden{
  display:none !important;
}

.menuCard{
  position:relative;
  width:min(100%,430px);
  overflow:hidden;
  padding:30px 22px 24px;
  border-radius:28px;
  border:1px solid rgba(79,204,255,.24);
  background:
    linear-gradient(155deg,rgba(18,26,45,.97),rgba(6,9,17,.97));
  box-shadow:
    inset 0 0 60px rgba(54,230,255,.035),
    0 30px 90px rgba(0,0,0,.55),
    0 0 40px rgba(37,100,220,.12);
  text-align:center;
}

.menuCard::before{
  content:"";
  position:absolute;
  left:-30%;
  top:-90px;
  width:160%;
  height:180px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(54,230,255,.09),
    transparent
  );
  transform:rotate(-8deg);
}

.menuLogo{
  position:relative;
  margin:0;
  font-size:60px;
  line-height:.9;
  font-weight:1000;
  font-style:italic;
  letter-spacing:10px;
  color:#fff;
  text-shadow:
    0 0 9px #fff,
    0 0 22px var(--cyan),
    0 0 48px rgba(55,125,255,.75);
}

.menuCode{
  position:relative;
  margin-top:11px;
  color:var(--cyan);
  font-size:10px;
  font-weight:900;
  letter-spacing:5px;
}

.menuDivider{
  position:relative;
  width:72%;
  height:1px;
  margin:25px auto 19px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  box-shadow:0 0 10px var(--cyan);
}

.menuText{
  position:relative;
  margin:0 auto 22px;
  max-width:310px;
  color:#aab7cf;
  font-size:13px;
  line-height:1.55;
}

.mainBtn{
  position:relative;
  width:100%;
  height:62px;
  border:none;
  border-radius:19px;
  cursor:pointer;
  color:white;
  font-weight:1000;
  font-size:16px;
  letter-spacing:2px;
  background:
    linear-gradient(135deg,#1e52bb,#247cf7 52%,#20d8ee);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.4),
    inset 0 -10px 24px rgba(0,0,0,.17),
    0 12px 35px rgba(22,104,255,.32),
    0 0 25px rgba(54,230,255,.18);
}

.mainBtn:active{
  transform:scale(.97);
}

.secondaryBtn{
  position:relative;
  width:100%;
  height:50px;
  margin-top:11px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  color:#ccd6e9;
  font-size:12px;
  font-weight:900;
  letter-spacing:1.3px;
  background:rgba(255,255,255,.055);
}

#bestStart{
  position:relative;
  margin-top:18px;
  color:#6e7d98;
  font-size:10px;
  letter-spacing:1.6px;
}

#bestStart span{
  color:var(--yellow);
  font-weight:1000;
}

#gameOverScreen .menuLogo{
  font-size:35px;
  letter-spacing:5px;
}

.resultGrid{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:20px 0;
}

.resultItem{
  padding:13px 8px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.045);
}

.resultLabel{
  display:block;
  color:#7887a3;
  font-size:8px;
  font-weight:900;
  letter-spacing:1.2px;
}

.resultValue{
  display:block;
  margin-top:5px;
  color:white;
  font-size:22px;
  font-weight:1000;
}

#finalScore{
  color:var(--cyan);
}

#finalBest{
  color:var(--yellow);
}

#pauseBtn{
  position:absolute;
  z-index:14;
  top:calc(env(safe-area-inset-top) + 112px);
  right:12px;
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  color:#c8d3e8;
  background:rgba(10,15,25,.74);
  backdrop-filter:blur(8px);
  font-weight:1000;
  font-size:13px;
}

#toast{
  position:absolute;
  z-index:20;
  top:29%;
  left:50%;
  max-width:88%;
  padding:11px 17px;
  border-radius:14px;
  color:white;
  font-size:14px;
  font-weight:1000;
  letter-spacing:1px;
  text-align:center;
  background:rgba(8,12,22,.85);
  border:1px solid rgba(54,230,255,.32);
  box-shadow:
    0 12px 40px rgba(0,0,0,.45),
    0 0 24px rgba(54,230,255,.16);
  backdrop-filter:blur(10px);
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-10px) scale(.92);
  transition:.22s ease;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}

#flash{
  position:absolute;
  inset:0;
  z-index:18;
  pointer-events:none;
  opacity:0;
  background:white;
}

#comboSplash{
  position:absolute;
  left:50%;
  top:40%;
  z-index:19;
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-50%) scale(.6) rotate(-7deg);
  text-align:center;
}

#comboSplash.show{
  animation:comboPop .8s ease forwards;
}

.comboBig{
  color:white;
  font-size:42px;
  font-weight:1000;
  font-style:italic;
  line-height:.9;
  text-shadow:
    0 0 10px white,
    0 0 22px var(--cyan),
    0 8px 0 rgba(20,76,160,.6);
}

.comboSmall{
  margin-top:8px;
  color:var(--yellow);
  font-size:12px;
  font-weight:1000;
  letter-spacing:4px;
  text-shadow:0 0 12px var(--yellow);
}

@keyframes comboPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.5) rotate(-12deg);
  }
  18%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.18) rotate(3deg);
  }
  65%{
    opacity:1;
    transform:translate(-50%,-54%) scale(1) rotate(0);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-72%) scale(.85);
  }
}

@media (min-width:700px){
  #app{
    max-width:520px;
    height:96vh;
    top:2vh;
    margin:auto;
    border-radius:28px;
    box-shadow:0 30px 100px rgba(0,0,0,.75);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
}

@media (max-height:620px){
  .ctrl{
    width:54px;
    height:54px;
  }

  #rotateBtn{
    width:60px;
    height:60px;
  }

  #dropBtn{
    width:66px;
    height:66px;
  }

  #powerBtn{
    width:46px;
    height:46px;
  }

  #missionPanel{
    display:none;
  }

  #pauseBtn{
    top:calc(env(safe-area-inset-top) + 70px);
  }
}
</style>
</head>

<body>
<div id="app">
  <canvas id="game"></canvas>

  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div id="flash"></div>

  <div id="hud">
    <div class="topRow">
      <div class="logoBox">
        <div class="logo">FIT</div>
        <div class="logoSub">WAREHOUSE</div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="statLabel">СЧЁТ</span>
          <span class="statValue" id="scoreValue">0</span>
        </div>

        <div class="stat">
          <span class="statLabel">СМЕНА</span>
          <span class="statValue" id="levelValue">1</span>
        </div>

        <div class="stat">
          <span class="statLabel">СЕРИЯ</span>
          <span class="statValue" id="comboValue">×1</span>
        </div>
      </div>
    </div>

    <div id="missionPanel">
      <div class="missionTop">
        <div id="missionText">ЗАГРУЗКА СИСТЕМЫ</div>
        <div id="missionCount">0 / 0</div>
      </div>
      <div class="progressTrack">
        <div id="missionBar"></div>
      </div>
    </div>
  </div>

  <button id="pauseBtn">Ⅱ</button>

  <div id="controls">
    <div class="controlRow">
      <div class="moveControls">
        <button class="ctrl" id="leftBtn">
          <span class="ctrlSymbol">◀</span>
        </button>

        <button class="ctrl" id="rightBtn">
          <span class="ctrlSymbol">▶</span>
        </button>
      </div>

      <div class="actionControls">
        <button class="ctrl" id="powerBtn">
          <span class="ctrlSymbol">✦</span>
        </button>

        <button class="ctrl" id="rotateBtn">
          <span class="ctrlSymbol">↻</span>
        </button>

        <button class="ctrl" id="dropBtn">
          <span class="ctrlSymbol">▼</span>
        </button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="comboSplash">
    <div class="comboBig" id="comboBig">×2</div>
    <div class="comboSmall" id="comboSmall">ИДЕАЛЬНО</div>
  </div>

  <div id="startScreen">
    <div class="menuCard">
      <h1 class="menuLogo">FIT</h1>
      <div class="menuCode">NIGHT SHIFT</div>
      <div class="menuDivider"></div>

      <p class="menuText">
        Система готова. Надень наушники, включи звук и начинай смену.
      </p>

      <button class="mainBtn" id="startBtn">НАЧАТЬ СМЕНУ</button>
      <button class="secondaryBtn" id="soundBtn">ЗВУК: ВКЛ</button>

      <div id="bestStart">
        ЛУЧШИЙ РЕЗУЛЬТАТ: <span id="bestStartValue">0</span>
      </div>
    </div>
  </div>

  <div id="pauseScreen" class="hidden">
    <div class="menuCard">
      <h2 class="menuLogo">ПАУЗА</h2>
      <div class="menuDivider"></div>
      <button class="mainBtn" id="continueBtn">ПРОДОЛЖИТЬ</button>
      <button class="secondaryBtn" id="restartPauseBtn">НАЧАТЬ ЗАНОВО</button>
    </div>
  </div>

  <div id="gameOverScreen" class="hidden">
    <div class="menuCard">
      <h2 class="menuLogo">СМЕНА ОКОНЧЕНА</h2>

      <div class="resultGrid">
        <div class="resultItem">
          <span class="resultLabel">РЕЗУЛЬТАТ</span>
          <span class="resultValue" id="finalScore">0</span>
        </div>

        <div class="resultItem">
          <span class="resultLabel">РЕКОРД</span>
          <span class="resultValue" id="finalBest">0</span>
        </div>

        <div class="resultItem">
          <span class="resultLabel">СМЕНА</span>
          <span class="resultValue" id="finalLevel">1</span>
        </div>

        <div class="resultItem">
          <span class="resultLabel">ПАЛЕТЫ</span>
          <span class="resultValue" id="finalPallets">0</span>
        </div>
      </div>

      <button class="mainBtn" id="restartBtn">ЕЩЁ ОДНА СМЕНА</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ЧАСТЬ 1 ИЗ 3 — НЕ ЗАКРЫВАЙ ТЕГ SCRIPT */
